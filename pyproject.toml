[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelinemedic"
version = "0.1.0"
description = "A bounded repair controller and independent verifier for Olist pipelines"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2"]

[project.scripts]
pipelinemedic = "pipelinemedic.__main__:main"

[tool.setuptools.packages.find]
include = ["pipelinemedic*"]
